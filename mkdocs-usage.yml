site_name: "Budget YPII - Panduan Pengguna"
site_description: "Panduan penggunaan lengkap aplikasi Budget YPII — Simulasi Rencana Anggaran Belanja Yayasan Penyelenggaraan Ilahi Indonesia"
site_author: "Yayasan Penyelenggaraan Ilahi Indonesia"
site_url: "https://cakrawala-tumbuh.github.io/budget-sekolah-app/"
repo_url: "https://github.com/cakrawala-tumbuh/budget-sekolah-app"
repo_name: "cakrawala-tumbuh/budget-sekolah-app"
edit_uri: edit/master/docs-usage/

docs_dir: docs-usage
site_dir: site-usage

theme:
  name: material
  language: id
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Ganti ke mode gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Ganti ke mode terang
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      lang: id
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cakrawala-tumbuh/budget-sekolah-app

nav:
  - Beranda: index.md
  - Memulai:
    - Cara Memulai: memulai/index.md
  - Tata Kelola:
    - Ringkasan: tata-kelola/index.md
    - Rencana Dokumen Tata Kelola: rencana-dokumen-tata-kelola.md
    - SOP: tata-kelola/sop/index.md
    - Decision Table: tata-kelola/dt/index.md
    - Otomasi Sistem: tata-kelola/ots/index.md
    - Instruksi Kerja: tata-kelola/ik/index.md
  - Referensi:
    - FAQ: referensi/faq.md
